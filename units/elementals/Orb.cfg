#textdomain wesnoth-Frost_Mage

# Borrowed from Alariel's Journey

[unit_type]
    id=Orb
    name= _ "Orb"
    race=elemental
    image="units/elementals/arcaneorb.png"
    profile="portraits/elementals/arcaneorb.png"
    small_profile="portraits/elementals/arcaneorb_sm.png"
    # Illuminates halo glow/fade effect
    halo="halo/orb-illuminates.png~O(1.0):3000,halo/orb-illuminates.png~O(0.9):200,halo/orb-illuminates.png~O(0.8):200,halo/orb-illuminates.png~O(0.7):200,halo/orb-illuminates.png~O(0.6):200,halo/orb-illuminates.png~O(0.5):200,halo/orb-illuminates.png~O(0.4):3000,halo/orb-illuminates.png~O(0.5):200,halo/orb-illuminates.png~O(0.6):200,halo/orb-illuminates.png~O(0.7):200,halo/orb-illuminates.png~O(0.8):200,halo/orb-illuminates.png~O(0.9):200"
    
    hitpoints=40
    movement_type=smallfly
    movement=5
    experience=180
    level=2
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=30
    usage=archer
    die_sound=wail-long.wav
    description=_ "Manifestation of white magic as an elemental, the Orb now casts forth its glow into the physical realms. Able to both regenerate and illuminate, the Orb has become a powerful force for the good."
    {DEFENSE_ANIM "units/elementals/arcaneorb.png" "units/elementals/arcaneorb.png" wail.wav }
    [abilities]
  		{ABILITY_REGENERATES}
  		{ABILITY_ILLUMINATES}
    [/abilities]
    [attack]
        name=orb strike
        description=_"orb strike"
        icon=attacks/wisp-strike.png
        type=arcane
        range=melee
        damage=5
        number=3
        range=melee
    [/attack]
    [attack]
        name=orb blast
        description= _"orb blast"
        type=arcane
        icon=attacks/wisp-blast.png
        damage=7
        number=4
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [recruit_anim]
        [frame]
            begin=-100
            end=100
            image="units/elementals/arcaneorb.png"
            alpha="0~1:300"
        [/frame]
        [frame]
            begin=-100
            end=100
            image="units/elementals/arcaneorb.png"
        [/frame]
        [frame]
            begin=-100
            end=100
            image="units/elementals/arcaneorb.png"
        [/frame]
    [/recruit_anim]
    
    # WISP BLAST ATTACK
    [attack_anim]
        [filter_attack]
            name=orb blast
        [/filter_attack]
        hits=yes
        {MISSILE_FRAME_FAERIE_FIRE}

        [frame]
            begin=-450
            end=-375
            image="units/elementals/arcaneorb.png"
            sound=magic-faeriefire.ogg

            halo=halo/elven/faerie-fire-halo1.png
        [/frame]
        [frame]
            begin=-375
            end=-300
            image="units/elementals/arcaneorb.png"
            halo=halo/elven/faerie-fire-halo2.png
        [/frame]
        # TODO arcaneorb-1.png is missing!
        [frame]
            begin=-300
            end=-225
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo3.png
        [/frame]
        [frame]
            begin=-225
            end=-150
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo4.png
        [/frame]
        [frame]
            begin=-150
            end=-75
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo5.png
        [/frame]
        [frame]
            begin=-75
            end=0
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo6.png
        [/frame]
        [frame]
            begin=-0
            end=75
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo7.png
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=orb blast
        [/filter_attack]
        hits=no
        {MISSILE_FRAME_FAERIE_FIRE}

        [frame]
            begin=-450
            end=-375
            image="units/elementals/arcaneorb.png"
            sound=magic-faeriefire-miss.ogg
            halo=halo/elven/faerie-fire-halo1.png
        [/frame]
        [frame]
            begin=-375
            end=-300
            image="units/elementals/arcaneorb.png"
            halo=halo/elven/faerie-fire-halo2.png
        [/frame]
        [frame]
            begin=-300
            end=-225
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo3.png
        [/frame]
        [frame]
            begin=-225
            end=-150
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo4.png
        [/frame]
        [frame]
            begin=-150
            end=-75
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo5.png
        [/frame]
        [frame]
            begin=-75
            end=0
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo6.png
        [/frame]
        [frame]
            begin=-0
            end=75
            image="units/elementals/arcaneorb-1.png"
            halo=halo/elven/faerie-fire-halo7.png
        [/frame]
    [/attack_anim]
    
    # WISP STRIKE
    [attack_anim]
        [filter_attack]
            name=orb strike
        [/filter_attack]
        hits=yes
        [frame]
            begin=-200
            end=-150
            image="units/elementals/arcaneorb.png"
        [/frame]
        [frame]
            begin=-150
            end=0
            sound=zap_hit.ogg
            image="units/elementals/arcaneorb.png"
            halo=halo/wisp_zap_02.png
        [/frame]
        [frame]
            begin=0
            end=75
            image="units/elementals/arcaneorb.png"
        [/frame]
    [/attack_anim]
    
    [attack_anim]
        [filter_attack]
            name=orb strike
        [/filter_attack]
        hits=no
        [frame]
            begin=-200
            end=-150
            image="units/elementals/arcaneorb.png"
        [/frame]
        [frame]
            begin=-150
            end=0
            sound=zap_miss.ogg
            image="units/elementals/arcaneorb.png"
            halo=halo/wisp_zap_01.png
        [/frame]
        [frame]
            begin=0
            end=75
            image="units/elementals/arcaneorb.png"
        [/frame]
    [/attack_anim]
    
    # DEATH ANIM
    [death]
        [frame]
            begin=0
            end=250
            alpha="1~0.5:250"
            image="units/elementals/arcaneorb.png"
            sound=wail-long.wav
        [/frame]
        [frame]
            begin=250
            end=500
            alpha="0.5~1:250"
            image="units/elementals/arcaneorb.png"
        [/frame]
        [frame]
            begin=500
            end=750
            image="units/elementals/arcaneorb.png"
        [/frame]
        [frame]
            begin=750
            end=1000
            alpha="1~0:250"
            image="units/elementals/arcaneorb.png"
        [/frame]
    [/death]
    
    
[/unit_type]
