[language]
	type_electric= _ "electric"
	type_natural= _ "natural"
	type_water= _ "water"
[/language]
		#  type_dark= _ "dark"
		#  type_void= _ "void"
		#  type_wind= _ "wind"

[units]
	[resistance_defaults]
		# technically a dual typing
		# if the enemy is weak to either cold or impact
		# they will be hurt.
		id="water"
		default="((cold+impact)/2)"
	[/resistance_defaults]
	[resistance_defaults]
		id="electric"
		default="(fire+20)"
	[/resistance_defaults]
	[resistance_defaults]
		id="natural"
		default="(arcane+10)"
	[/resistance_defaults]

	[race]
		id=VR_darkelf
		male_name= _ "race^Dark Elf"
		female_name= _ "race+female^Dark Elf"
		plural_name= _ "race^Dark Elves"
		# wmllint: local spelling unvegetated
		description= _ "After millennia of peering into the arcane realm, and drawing magic from it, gradually something changed. First it showed as erratic behavior, small acts of selfishness and idiosyncrasy. But these effects, being confined only to the most skilled of Sylphs and Sorceresses, were ignored and unnoticed.
And so, the corruption spread. The evil blossomed, consuming the most brilliant of minds the elvenkind had ever produced, the ones who had guided the path for long. The Sylphs, their apprentices, the guards close to them, their family... and so on.
The ones remaining, still untouched, begin to speak of <italic>Darkened Elves</italic> or <italic>Dark Elves</italic>. And many among them, only in whispers, maintaining the illusion of an unbroken race.
<italic>Look into the Abyss, and the Abyss looks back to you...</italic>"
		num_traits=2
		markov_chain_size=2
		{ELVISH_NAMES}
		{TRAIT_DEXTROUS}
	[/race]
[/units]

#ifdef CAMPAIGN_FROST_MAGE
	# load War of legends
	{~/add-ons/War_of_Legends/campaign-minimal.cfg}
