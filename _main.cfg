	{~/add-ons/Frost_Mage/scenarios}
	{~/add-ons/Frost_Mage/maps}
	# ensure custom terrains are loaded in scenario files
	{~/add-ons/Frost_Mage/utils/terrain.cfg}

	[+units]
		# movetypes
		{~/add-ons/Frost_Mage/units/movetypes.cfg}

		{~/add-ons/Frost_Mage/units/human-magi}
		{~/add-ons/Frost_Mage/units/human-loyalists}
