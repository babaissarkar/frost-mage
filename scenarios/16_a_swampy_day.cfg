#textdomain wesnoth-Frost_Mage

[scenario]
	id=16_a_swampy_day
	name=_"Unending Feud"
	map_file="~add-ons/Frost_Mage/maps/16_a_swampy_day.map"
	{TURNS 40 35 30}
	victory_when_enemies_defeated=no

	{DEFAULT_SCHEDULE}

    [side]
		side=1
		controller=human
		no_leader=yes
		{INCOME 3 3 3}
		{GOLD 200 160 140}
		#  fog=yes
		#  shroud=yes
		team_name=heroes
		user_team_name= _ "Erinna and Friends"
		[leader]
			# wmllint: recognize erinna
			{CHARACTER_STATS:ERINNA}
			type=Frost Mage JoaFM
		[/leader]
    [/side]

    [side]
		side=2
		controller=ai
		team_name=heroes
		{INCOME 6 6 6}
		{GOLD 600 500 400}
		user_team_name= _ "Dwarvish Garrison"
        [leader]
			id=dwarf_captain
            type=Dwarvish Sentinel
        [/leader]
        [unit]
			id=guard1
			x,y=26,4
			type=Dwarvish Stalwart
		[/unit]
		[unit]
			id=guard2
			x,y=28,2
			type=Dwarvish Stalwart
		[/unit]
		[unit]
			id=guard3
			x,y=34,12
			type=Dwarvish Stalwart
		[/unit]
		[unit]
			id=guard4
			x,y=32,12
			type=Dwarvish Stalwart
		[/unit]
    [/side]

	#  [side]
	#  	side=3
	#  	controller=human
	#  	team_name=saurians
	#  	user_team_name=_ "Gnolls"
	#  	type=Minotaur Behemoth
	#  	recruit=Gnoll Marksman, Gnoll, Gnoll Deadeye
	#  	{INCOME 6 6 6}
	#  	{GOLD 300 400 500}
	#  [/side]
	[side]
		side=3
		controller=ai
		team_name=saurians
		user_team_name=_ "Saurians"
		type=Saurian Flanker
		recruit=Saurian Ambusher,Saurian Soothsayer,Saurian Oracle
		{INCOME 6 6 6}
		{GOLD 300 400 500}
	[/side]

	[side]
		side=4
		controller=ai
		team_name=saurians
		user_team_name=_ "Saurians"
		type=Saurian Flanker
		recruit=Saurian Ambusher,Saurian Soothsayer,Saurian Oracle
		{INCOME 6 6 6}
		{GOLD 300 400 500}
	[/side]

	[side]
		side=5
		controller=ai
		team_name=saurians
		user_team_name=_ "Saurians"
		type=Saurian Flanker
		recruit=Saurian Ambusher,Saurian Soothsayer,Saurian Oracle
		{INCOME 6 6 6}
		{GOLD 300 400 500}
	[/side]

	[event]
		name=prestart
		{MAKE_LOYAL_LEADER erinna}
		[unit]
			id=mage
			side=1
			type=Mage
			placement=leader
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
		[/unit]
		[unit]
			# wmllint: recognize raizr
			{CHARACTER_STATS:RAIZR}
			type=Inferno Drake
			placement=leader
		[/unit]
		[unit]
			# wmllint: recognize eliel
			{CHARACTER_STATS:ELIEL}
			type=Elvish Ranger
			placement=leader
		[/unit]
        [unit]
			# wmllint: recognize kalenz
			id=kalenz
			type=Elvish High Lord
			name= _ "Kalenz"
			placement=leader
			facing=se
			profile="portraits/elves/kalenz.webp"
			[modifications]
			    {TRAIT_AGED}
			[/modifications]
			[abilities]
			    {ABILITY_LEADERSHIP}
			[/abilities]
		[/unit]

		## Capture villages
		[capture_village]
            side=2
            x,y=31,11
        [/capture_village]
		[capture_village]
            side=2
            x,y=38,8
        [/capture_village]
		[capture_village]
            side=2
            x,y=34,5
        [/capture_village]
		[capture_village]
            side=2
            x,y=34,8
        [/capture_village]

		## Setup Dwarf AIs
		[micro_ai]
            side=2
            ai_type=zone_guardian
            action=add

            [filter]
                id=guard1,guard2,guard3,guard4
            [/filter]
			[filter_location]
                x,y=24-41,0-15
            [/filter_location]
        [/micro_ai]
		[micro_ai]
            side=2
            ai_type=return_guardian
            action=add

            [filter]
                id=dwarf_captain
            [/filter]
			return_x,return_y=36,4
        [/micro_ai]

		{VARIABLE is_challenged false}
	[/event]

	# Dwarves challenge if you enter territory, attack if you ignore
	[event]
		name=moveto
		first_time_only=false

		[filter_location]
            x,y=24-41,0-15
        [/filter_location]

		[if]
			[variable]
				name=is_challenged
				boolean_equals=false
			[/variable]
			[then]
				[message]
					speaker=dwarf_captain
					message= _ "Halt! That is Dwarf territory. Move forward at your own peril!"
				[/message]
				[set_variable]
					name=is_challenged
					value=true
				[/set_variable]
			[/then]
			[else]
				# Dwarves attack
				[modify_side]
					side=2
					team_name=dwarves
				[/modify_side]
				[allow_recruit]
					side=2
					type=Dwarvish Scout, Dwarvish Fighter, Dwarvish Guardsman
				[/allow_recruit]
				[message]
					speaker=dwarf_captain
					message= _ "Attack the invaders!"
				[/message]
			[/else]
		[/if]
	[/event]

    {DEATH_EVENT (erinna,raizr,liyesa,kalenz,eliel,mage)}
	{TIMEOUT_EVENT}
[/scenario]