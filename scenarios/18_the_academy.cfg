[scenario]
	id=17_the_academy
	name=_"The Academy"
	map_file="~add-ons/Frost_Mage/maps/18.map"
    victory_when_enemies_defeated=no

	{DEFAULT_SCHEDULE}

    [side]
		side=1
		controller=human
		{INCOME 3 3 3}
		{GOLD 200 160 140}
        fog=yes
		team_name=heroes
		user_team_name= _ "Erinna and Friends"
		[leader]
			# wmllint: recognize erinna
			{CHARACTER_STATS:ERINNA}
			type=Frost Mage JoaFM
            x,y=12,2
		[/leader]
        [unit]
			id=mage
			side=1
			type=Mage
			placement=leader
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
		[/unit]
        [unit]
            # wmllint: recognize sorceress1
            id=sorceress1
            side=1
            type=White Sorceress
        [/unit]
    [/side]
    [side]
        side=2
        controller=ai
        team_name=heroes
		user_team_name= _ "Raizr's Flight"
        [leader]
			# wmllint: recognize raizr
			{CHARACTER_STATS:RAIZR}
			type=Inferno Drake
			placement=12,2
            find_vacant=yes
		[/leader]
    [/side]

    [event]
		name=start

        {MSG mage1 _"Finally! That blue over there? It must be the Silver Sea. The Academy's on an island in the middle."}
        {MSG erinna _ "But I don't see a way to cross the water. No docks, no boats."}
        {MSG mage1 _ "Do we really need all that? With you and the drakes around, it's piece of a joke."}

        # Silver Mage from Academy teleports in. Dialog about getting into academy.
        # Crossing the water on their own is the test.
        # Raizr stay on shore and watches.
    [/event]
[/scenario]